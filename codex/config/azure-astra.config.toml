# Azure GPT-6 picker, with Astra as the starting model.
# Use with: codex --profile azure-astra

model = "gpt-6-astra"
model_provider = "azure"
model_reasoning_effort = "medium"
model_catalog_json = "model-catalogs/azure-gpt6.json"
# Temporary larger window for Azure sessions; keep headroom for new tool output.
model_context_window = 400000
model_auto_compact_token_limit = 350000
