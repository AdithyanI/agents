# Canonical portable baseline for ~/.codex/config.toml
# Keep this focused on stable settings only.

cli_auth_credentials_store = "file"
mcp_oauth_credentials_store = "file"
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "live"
personality = "pragmatic"
suppress_unstable_features_warning = true

[features]
hooks = true
js_repl = true
remote_connections = true
goals = true
memories = false
apps = true
external_migration = false

[notice.external_config_migration_prompts]
home = true

# Optional Azure provider. Subscription access remains the default; selecting
# a provider and model is separate from registering this connection.
[model_providers.azure]
name = "Azure OpenAI"
base_url = "https://aipodcasting-openai.openai.azure.com/openai/v1"
env_key = "AZURE_OPENAI_API_KEY"
wire_api = "responses"

[tui]
theme = "catppuccin-macchiato"
status_line = ["model-with-reasoning", "context-remaining", "current-dir", "codex-version", "context-window-size", "session-id", "fast-mode"]
